name: scope-check
on: [pull_request]
jobs:
  scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Resolver Zona Verde a partir das labels zona:<glob> aplicadas por humano (nunca do próprio PR)
        run: |
          mkdir -p .claude; : > .claude/zona-verde
          echo '${{ toJson(github.event.pull_request.labels.*.name) }}' | python3 -c 'import sys,json; [print(l[5:]) for l in json.load(sys.stdin) if l.startswith("zona:")]' >> .claude/zona-verde
          cat .claude/zona-verde
      - name: Scope check
        run: bash scripts/scope-check.sh "origin/${{ github.base_ref }}"
