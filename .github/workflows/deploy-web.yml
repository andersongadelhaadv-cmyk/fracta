name: Deploy fracta.pro (web)

on:
  push:
    branches: [master]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/fracta-web

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 76.13.170.79 >> ~/.ssh/known_hosts

      - name: Pull image and restart on VPS (no build on VPS)
        run: |
          ssh -i ~/.ssh/id_ed25519 root@76.13.170.79 '
            set -e
            cd /opt/apps/fracta-web
            docker compose pull
            docker compose up -d
            ok=0
            for i in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:3850 >/dev/null 2>&1; then ok=1; break; fi
              sleep 3
            done
            if [ "$ok" != "1" ]; then
              echo "::error::healthcheck do fracta-web falhou"
              docker compose logs --tail 60
              exit 1
            fi
            echo "fracta-web OK em 127.0.0.1:3850"
          '
