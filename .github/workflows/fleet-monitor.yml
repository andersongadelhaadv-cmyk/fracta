name: Fleet monitor

on:
  schedule:
    - cron: '0 7 * * *'  # diário 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write   # commit do baseline
  issues: write     # abrir issue em regressão

concurrency:
  group: fleet-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.9 # versão vem do packageManager do package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22   # o motor (node:sqlite/undici) pede >= 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "@fracta/fleet-monitor..." build

      # O estado mutável do bot VIVE numa branch dedicada (monitor-baseline), não no master.
      # Motivo: o master é protegido (required status checks) para que o auto-merge do
      # dependabot só complete no VERDE. Essa proteção — corretamente — também barra o push
      # do bot (`GH006: Protected branch update failed`), e o monitor passou a falhar.
      # Enfraquecer a proteção seria trocar segurança por conveniência. Então:
      #   - `master` guarda o PISO inicial (versionado, revisável em PR);
      #   - `monitor-baseline` guarda o estado corrente, que o bot atualiza sozinho.
      - name: Buscar o baseline vigente (branch dedicada; fallback = o piso do master)
        run: |
          if git fetch origin monitor-baseline 2>/dev/null && git cat-file -e origin/monitor-baseline:fleet-baseline.json 2>/dev/null; then
            git show origin/monitor-baseline:fleet-baseline.json > fleet-baseline.json
            echo "baseline: branch monitor-baseline"
          else
            echo "baseline: piso versionado no master (branch dedicada ainda não existe)"
          fi

      - name: Re-scan passivo da frota
        run: node packages/fleet-monitor/dist/cli.js --baseline fleet-baseline.json --out .

      - name: Publicar relatório no resumo do run
        if: always()
        run: cat fleet-report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Persistir baseline na branch dedicada (nunca no master protegido)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          tmp=$(mktemp) && cp fleet-baseline.json "$tmp"
          git checkout -B monitor-baseline
          cp "$tmp" fleet-baseline.json
          git add -f fleet-baseline.json
          if git diff --cached --quiet; then
            echo "baseline inalterado — nada a persistir"
          else
            git commit -m "chore(monitor): baseline da frota [skip ci]"
            git push -f origin monitor-baseline
          fi

      # Issue IDEMPOTENTE: atualiza a existente em vez de abrir uma nova a cada run, e
      # FECHA sozinha quando a frota recupera. É o par OBRIGATÓRIO da catraca do baseline
      # (ratchetBaseline): como a regressão agora persiste até ser corrigida, um
      # `issues.create` cego abriria uma issue por DIA. Silêncio virou spam — nenhum serve.
      - name: Sincronizar issue de regressão (abrir / atualizar / fechar)
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs')
            if (!fs.existsSync('regressions.json')) return
            const regs = JSON.parse(fs.readFileSync('regressions.json', 'utf8'))
            const { owner, repo } = context.repo

            // Label DEDICADA (`fleet-regression`): só a issue auto-gerada pelo bot a carrega.
            // Antes eu buscava por `monitor` — label que HUMANOS também usam — e o bot
            // SOBRESCREVEU o título e o corpo de uma issue humana (#88). Matching frouxo em
            // código que ESCREVE é destrutivo: a chave precisa ser exclusiva de quem escreve.
            const abertas = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'fleet-regression', per_page: 100,
            })
            const atual = abertas.data.find((i) => !i.pull_request)

            if (!regs.length) {
              if (atual) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: atual.number,
                  body: '✅ Frota recuperada — nenhuma regressão no último scan. Fechando automaticamente.',
                })
                await github.rest.issues.update({ owner, repo, issue_number: atual.number, state: 'closed' })
              }
              core.info('Sem regressões.')
              return
            }

            const lines = regs.map((r) => {
              const what = r.kind === 'grade-drop' ? `nota caiu **${r.before} → ${r.after}**` : `**${r.before} → ${r.after}**`
              return `- **${r.label}** (\`${r.domain}\`): ${what}`
            })
            const title = `🔻 Regressão na frota (${regs.length})`
            const body = [
              '## ⚠️ Regressão de segurança detectada na frota',
              '',
              'O monitor passivo do Fracta detectou queda em um ou mais alvos:',
              '',
              ...lines,
              '',
              `_Última verificação: ${new Date().toISOString()} — esta issue é atualizada a cada run e fecha sozinha quando a frota recuperar._`,
              '',
              '> O baseline usa CATRACA: o alvo degradado **continua** sendo reportado até ser de fato corrigido (antes, a queda virava o novo "normal" e o alarme silenciava).',
              '> Gerado por `.github/workflows/fleet-monitor.yml`.',
            ].join('\n')

            if (atual) {
              await github.rest.issues.update({ owner, repo, issue_number: atual.number, title, body })
              core.info(`Issue #${atual.number} atualizada (${regs.length} regressões).`)
            } else {
              await github.rest.issues.create({ owner, repo, title, body, labels: ['fleet-regression', 'monitor', 'security'] })
            }
