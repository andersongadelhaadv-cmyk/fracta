name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.10 # versão vem do packageManager do package.json

      - uses: actions/setup-node@v7
        with:
          # Node 22+ (>=22.5) é obrigatório: @fracta/store usa node:sqlite (builtin
          # só nessa faixa). Em Node 20 os testes do store falham. Casa com o Node 22
          # escopado usado em produção p/ ligar estado/regressão.
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @fracta/verify exec playwright install --with-deps chromium

      - run: pnpm build

      - run: pnpm test

  # Auto-vigilância: o Fracta varre a si mesmo com o MESMO gitleaks que o agente
  # SECRETS usa. Falha o CI se algum segredo for commitado. Grátis em repo público.
  secrets-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # histórico completo p/ a varredura
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Dogfood: o Fracta roda o scan COMPLETO no próprio repo (alvo repo-only em
  # configs/self.yaml). Falha o CI se a ferramenta reportar critical/high de
  # confiança alta na própria base — a régua vale para nós primeiro. Build só do
  # CLI (turbo --filter) p/ não depender do build do @fracta/web. --no-state:
  # determinístico, sem regressão/db entre runs. Invoca o dist via `node` (robusto,
  # sem depender de shim de bin).
  dogfood-self:
    name: Dogfood (fracta scan self)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.10 # versão vem do packageManager do package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter=fractascan
      - name: Run Fracta scan on itself
        run: |
          node packages/cli/dist/index.js scan \
            --target fracta-self \
            --config configs/self.yaml \
            --no-state \
            --fail-on critical,high \
            --output ./fracta-reports
      - name: Upload dogfood report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fracta-dogfood-report
          path: fracta-reports/
          if-no-files-found: ignore

  # Auditabilidade das dependências. O CLI/MCP EMBUTEM (`tsup noExternal`) o código
  # @fracta/* e algumas deps transitivas (ex.: undici) no `dist` publicado — então
  # `npm audit` rodado no PACOTE instalado NÃO enxerga a árvore toda. A resposta honesta:
  # auditar a ÁRVORE COMPLETA aqui, na fonte, onde o pnpm-lock.yaml é a verdade — e
  # publicar um SBOM (CycloneDX) que ENUMERA cada dependência, inclusive as embutidas.
  # Um cético roda `npm audit` no que instala; nós provamos a auditoria da árvore no CI.
  deps-audit:
    name: Deps audit + SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.10 # versão vem do packageManager do package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Relatório da ÁRVORE COMPLETA (inclui devDeps do toolchain de build/test) — SEMPRE
      # gerado como artefato, para transparência total.
      - name: pnpm audit (árvore completa — relatório)
        run: |
          pnpm audit --json > pnpm-audit.json || true
          echo "### Resumo (árvore completa, incl. devDeps de build)" && (pnpm audit --audit-level=low || true)
      # GATE honesto: reprova só em CRITICAL nas dependências de PRODUÇÃO (o que de fato é
      # publicado/deployado). CVE crítico no toolchain de build (ex.: esbuild dev-server) NÃO
      # é embarcado no pacote npm nem no runtime — reprovar nele seria cry-wolf.
      - name: Reprova em CRITICAL de produção
        run: pnpm audit --prod --audit-level=critical
      # SBOM CycloneDX — enumera CADA dependência (incl. as embutidas no bundle).
      - name: Gera SBOM (CycloneDX)
        run: npx --yes @cyclonedx/cdxgen@11 -o sbom.cdx.json -t js --no-recurse || npx --yes @cyclonedx/cdxgen@11 -o sbom.cdx.json
      - name: Upload audit + SBOM
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fracta-deps-audit-sbom
          path: |
            pnpm-audit.json
            sbom.cdx.json
          if-no-files-found: warn

  # Node 20 smoke (NÃO é matriz de teste: `@fracta/store` usa node:sqlite,
  # builtin só em Node >= 22.5 — em Node 20 os testes do store falham POR DESIGN).
  # Aqui provamos, por EXECUÇÃO, a DEGRADAÇÃO GRACIOSA: o CLI funciona em Node 20
  # sem estado. `--help` sai 0; o scan (sem --no-state) tenta abrir o store, cai no
  # caminho "Estado indisponível" e SEGUE (detecção intacta), saindo 0.
  node20-smoke:
    name: Node 20 smoke (graceful degradation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.10 # versão vem do packageManager do package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter=fractascan
      - name: Smoke — fracta --help sai 0
        run: node packages/cli/dist/index.js --help
      - name: Smoke — scan degrada estado (node:sqlite ausente) e segue exit 0
        run: |
          set -o pipefail
          node packages/cli/dist/index.js scan \
            --target fracta-self \
            --config configs/self.yaml \
            --fail-on critical,high \
            --output ./fracta-reports 2>&1 | tee scan.log
          grep -q "Estado entre runs indisponível" scan.log || {
            echo "::error::Esperava a degradação graciosa de estado em Node 20 (node:sqlite ausente), mas o aviso não apareceu — o store rodou onde não deveria."
            exit 1
          }
