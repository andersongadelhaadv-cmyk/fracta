name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          # Node 22+ (>=22.5) é obrigatório: @fracta/store usa node:sqlite (builtin
          # só nessa faixa). Em Node 20 os testes do store falham. Casa com o Node 22
          # escopado usado em produção p/ ligar estado/regressão.
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm test
