name: Deploy to VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: []
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 76.13.170.79 >> ~/.ssh/known_hosts

      - name: Pull, install and build on VPS
        run: |
          ssh -i ~/.ssh/id_ed25519 root@76.13.170.79 '
            set -e
            cd /opt/apps/fracta
            git fetch --quiet origin master
            git reset --hard origin/master
            pnpm install --silent
            pnpm build
            chmod +x packages/cli/dist/index.js
            ln -sf /opt/apps/fracta/packages/cli/dist/index.js /usr/local/bin/fracta
            fracta --help | head -3
          '

      - name: Smoke test
        run: |
          ssh -i ~/.ssh/id_ed25519 root@76.13.170.79 \
            'cd /opt/apps/fracta && node packages/cli/dist/index.js --help > /dev/null && echo "fracta CLI OK"'
