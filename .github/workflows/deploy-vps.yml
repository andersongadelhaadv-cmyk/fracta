name: Deploy to VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: []
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # ssh-keyscan flaka de forma transitória — tenta algumas vezes
          for i in 1 2 3 4 5; do
            ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts && break
            echo "ssh-keyscan tentativa $i falhou; retry em 5s"; sleep 5
          done

      - name: Pull, install and build on VPS
        run: |
          ssh -i ~/.ssh/id_ed25519 root@${{ secrets.VPS_HOST }} '
            set -e
            cd /opt/apps/fracta
            git fetch --quiet origin master
            git reset --hard origin/master
            pnpm install --silent
            # Build SÓ do CLI/MCP (+ deps). O apps/web é Next e é buildado no Actions
            # → GHCR (Docker), NUNCA na VPS. Excluí-lo evita rodar `next build` aqui.
            pnpm --filter "fractascan..." --filter "fractascan-mcp..." build
            chmod +x packages/cli/dist/index.js packages/mcp-server/dist/index.js
            # CLI global: se houver Node 22 escopado, instala um WRAPPER que o usa
            # (node:sqlite => estado/regressão ligados). Senão, symlink simples
            # (degradação graciosa). Idempotente: sobrevive ao auto-deploy — NÃO
            # reverte o wrapper para symlink (bug anterior que desligava o estado).
            if [ -x /opt/node-22/bin/node ]; then
              printf "#!/bin/sh\nexec /opt/node-22/bin/node /opt/apps/fracta/packages/cli/dist/index.js \"\$@\"\n" > /usr/local/bin/fracta
              chmod +x /usr/local/bin/fracta
            else
              ln -sf /opt/apps/fracta/packages/cli/dist/index.js /usr/local/bin/fracta
            fi
            fracta --help | head -3
          '

      - name: Smoke test
        run: |
          ssh -i ~/.ssh/id_ed25519 root@${{ secrets.VPS_HOST }} \
            'cd /opt/apps/fracta && node packages/cli/dist/index.js --help > /dev/null && echo "fracta CLI OK"'
