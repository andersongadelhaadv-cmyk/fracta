version: 2
updates:
  # Dependências npm/pnpm de todo o monorepo (raiz + apps + packages).
  # Agrupado p/ reduzir ruído; patches de segurança vêm em PRs semanais.
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/apps/web"
      - "/packages/*"
      - "/packages/agents/*"
      - "/packages/skills/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 8
    groups:
      production:
        dependency-type: "production"
        patterns: ["*"]
      dev:
        dependency-type: "development"
        patterns: ["*"]

  # Versões das actions usadas nos workflows de CI/CD.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
