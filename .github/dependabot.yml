version: 2
updates:
  # Monorepo pnpm = UM único pnpm-lock.yaml na RAIZ.
  # Apontar o dependabot para os sub-diretórios (apps/web, packages/*) o fazia bumpar o
  # package.json de um workspace SEM regenerar o lockfile da raiz → TODO job morria em
  # `pnpm install --frozen-lockfile` (ERR_PNPM_OUTDATED_LOCKFILE). Foi a causa dos PRs
  # #23/#78 nascerem vermelhos. Com a raiz só, ele enxerga o workspace inteiro (via
  # pnpm-workspace.yaml) e mantém o lockfile em sincronia.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 8
    groups:
      # `update-types` limita o GRUPO a minor+patch DE PROPÓSITO. Sem isso, um major
      # entra AGRUPADO — e num PR agrupado o `fetch-metadata` reporta `update-type` vazio,
      # então o auto-merge ("npm só patch/minor") não reconhece o major e mergeia mesmo
      # assim. Foi o que derrubou o master no #85 (undici 6→8 + react 18→19). Com o grupo
      # restrito, todo major de npm nasce como PR SINGLETON, onde o update-type é confiável
      # e o auto-merge bloqueia. (github-actions segue liberado a major noutro bloco.)
      production:
        dependency-type: "production"
        update-types: ["minor", "patch"]
        patterns: ["*"]
      dev:
        dependency-type: "development"
        update-types: ["minor", "patch"]
        patterns: ["*"]
    ignore:
      # Major do Next ADIADO por decisão consciente (o risco do major > a dívida que paga).
      # Sem este ignore, o dependabot reabre um PR 14→16 toda semana que nunca vai mergear
      # e polui a home do repo com ❌. Quando for a hora, fazer o major deliberadamente,
      # com teste — e só então remover este bloco.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]
      # undici 8 QUEBRA o lookup SSRF-safe (safe-fetch.ts): o connect.lookup do undici 8
      # muda o contrato e o fetch a 127.0.0.1 falha → passive-scanner dá 'inconclusive'.
      # Adiado até o guard ser adaptado ao undici 8, com teste. Foi a causa do #85.
      - dependency-name: "undici"
        update-types: ["version-update:semver-major"]
      # react/react-dom 19 é major de PRODUTO — o CI verde não prova que a app não regrediu.
      # Fazer o 18→19 deliberadamente, com QA. (Entrou por engano agrupado no #85.)
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

  # Versões das actions usadas nos workflows de CI/CD.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
