# Fracta — targets.yaml
# Configure seus targets de staging aqui. NUNCA use produção com dados reais.
# Variáveis de ambiente: ${ENV_VAR_NAME}

targets:
  exemplo-saas:
    url: https://staging.meuapp.com.br
    stack:
      - nestjs
      - prisma
      - nextjs
    auth:
      type: jwt
      endpoint: /api/auth/login
      credentials:
        email: test@meuapp.com.br
        password: "${TEST_PASSWORD}"
    agents:
      - AUTH Agent
      - IDOR Agent
      - HEADERS Agent
      - DOCS Agent
    ignore:
      - /api/health
      - /api/metrics
      - /api/docs

    # Campos OPCIONAIS para os agentes baseados em repositório (read-only).
    # Ausência → os checks correspondentes ficam `skipped` (nunca falso "seguro").
    #
    # repoPath: ./                      # repo local p/ dependencies, secrets, stack, compliance, docs
    # infra:                            # agente-infra (100% leitura, jamais executa nada)
    #   host: 76.13.170.79
    #   sshConfigPath: /etc/ssh/sshd_config
    #   dockerComposePath: ./docker-compose.yml
    # frontend:                         # checks de frontend do agente-stack
    #   framework: next
    #   envFiles: [.env.local, .env.production]
    # config:
    #   suppressions: []                # ids de findings já revisados como falso-positivo
    #   severityThreshold: high

