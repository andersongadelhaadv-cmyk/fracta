# Vive na VPS em /opt/apps/fracta-web/docker-compose.yml.
# A VPS só faz pull + restart (NUNCA builda). Imagem vem do GHCR via Actions.
services:
  web:
    image: ghcr.io/andersongadelhaadv-cmyk/fracta-web:latest
    # NÃO usar `pull_policy: always`: o deploy faz `docker compose pull` com login
    # GHCR isolado (config temporário). Com `always`, o `up -d` tentaria re-puxar
    # usando a credencial GHCR compartilhada da VPS → denied. O `pull` explícito já
    # busca o latest; o `up` usa a imagem local.
    restart: unless-stopped
    ports:
      - "127.0.0.1:3850:3850" # só loopback; nginx termina o TLS
    volumes:
      - ./data:/data # persiste fracta-web.db (shareIds + cache + emails)
    environment:
      - NODE_ENV=production
      - PORT=3850
      - HOSTNAME=0.0.0.0
      - FRACTA_WEB_DB=/data/fracta-web.db
