# /etc/nginx/sites-available/fracta.pro  (symlink em /etc/nginx/sites-enabled/)
# Bloco :80 para o desafio ACME. O `certbot --nginx -d fracta.pro -d www.fracta.pro`
# adiciona o bloco :443 com o cert Let's Encrypt e o redirect 80→443.
server {
    listen 80;
    listen [::]:80;
    server_name fracta.pro www.fracta.pro;

    # Proxy para o container Next standalone (loopback; TLS termina aqui no nginx).
    location / {
        proxy_pass http://127.0.0.1:3850;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
